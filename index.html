<title>Maison</title>
<script>
// Anti-cache : Home Assistant sert /local avec un cache long. version.json est lu sans cache ;
// si une version plus récente est publiée, on recharge index.html?v=<version> (nouvelle URL = pas de cache).
(function () {
  var v = 'dev';
  fetch('version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.v || j.v === v) return;
    var u = new URL(location.href);
    if (u.searchParams.get('v') === j.v) return;
    u.searchParams.set('v', j.v);
    location.replace(u.href);
  }).catch(function () {});
})();
</script>
