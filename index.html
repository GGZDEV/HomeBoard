<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E4B3E">
<title>Maison</title>
<script>
// Anti-cache : Home Assistant sert /local avec un cache long. version.json est lu sans cache ;
// si une version plus récente est publiée, on recharge index.html?v=<version> (nouvelle URL = pas de cache).
// Vérifié au chargement, puis toutes les 2 min et au réveil de l'écran : une tablette murale
// restée ouverte se met à jour toute seule après chaque publication.
(function () {
  var v = 'dev';
  window.HD_VERSION = v;
  function busy() {
    // Ne pas recharger pendant qu'on écrit une note ou qu'une fenêtre de réglage est ouverte.
    var a = document.activeElement;
    return !!document.querySelector('.modal') || !!(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName));
  }
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.v || j.v === v || busy()) return;
      var u = new URL(location.href);
      if (u.searchParams.get('v') === j.v) return;
      u.searchParams.set('v', j.v);
      location.replace(u.href);
    }).catch(function () {});
  }
  check();
  setInterval(check, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;family=Unbounded:wght@500;700&amp;family=Syne:wght@600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Serif+Display&amp;family=Cormorant+Garamond:wght@600;700&amp;family=Comfortaa:wght@600;700&amp;family=Orbitron:wght@500;700&amp;family=Righteous&amp;family=Dancing+Script:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>
<div id="app"></div>
<script>
// If a script fails (e.g. a browser too old), show why instead of a blank page.
// Old syntax on purpose so it runs everywhere.
(function () {
  function show(msg) {
    var app = document.getElementById('app');
    if (!app || app.children.length) return; // the dashboard already started: leave it alone
    app.innerHTML = '<main class="glass login" style="max-width:560px"><h1 style="font-size:24px">Le tableau de bord n\'a pas pu démarrer</h1>' +
      '<p class="hint" style="margin-top:12px;word-break:break-word"></p>' +
      '<p class="hint" style="margin-top:12px">Navigateur : ' + navigator.userAgent.replace(/[<>&]/g, '') + '</p></main>';
    app.querySelector('p').textContent = msg;
  }
  window.addEventListener('error', function (e) { show((e.message || 'Erreur') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  window.addEventListener('load', function () {
    setTimeout(function () { var app = document.getElementById('app'); if (app && !app.children.length) show('Aucun contenu affiché : un script ne s\'est pas chargé.'); }, 3000);
  });
})();
</script>

</body>
