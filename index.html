<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#eef2fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#06090f" media="(prefers-color-scheme: dark)">

  <!-- Ajout à l'écran d'accueil : l'application s'ouvre alors en plein écran,
       sans les barres du navigateur. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HomeBoard">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="description" content="HomeBoard — tableau de bord isométrique pour Home Assistant.">
  <title>HomeBoard · Tableau de bord Home Assistant</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="backdrop-glow" aria-hidden="true"></div>

  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>
      <div class="workspace">
        <section class="view-root" id="view-root"></section>
        <aside class="panel" id="panel" aria-label="Détails"></aside>
      </div>
    </div>
  </div>

  <p class="boot-error" id="boot-error" hidden></p>
  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript>
    <p class="boot-error">HomeBoard a besoin de JavaScript pour fonctionner.</p>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
